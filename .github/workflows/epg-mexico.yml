name: Actualizar EPG Mundial

on:
  schedule:
    # Se ejecuta diario a las 07:00 UTC (01:00 AM hora de Monterrey)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  grab-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Generar guia mundial (3 dias)
        run: npm run grab --- --channels=mundial_filtrado.xml --days=3 --delay=1000 --output=epg_mundial_3dias.xml

      - name: Guardar archivo actualizado
        run: |
          H="github.com"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.${H}"
          git add epg_mundial_3dias.xml
          git commit -m "Actualizacion diaria EPG Mundial" || exit 0
          git push
