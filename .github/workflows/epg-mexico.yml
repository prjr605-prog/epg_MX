name: Actualizar EPG Maestra

on:
  schedule:
    # Se ejecuta diario a las 07:00 UTC (01:00 AM hora de Monterrey)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  grab-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Generar guia base (3 dias)
        run: npm run grab --- --channels=mundial_filtrado.xml --days=3 --delay=1000 --output=epg_mundial_3dias.xml

      - name: Descargar todos los bloques de EPG (Proveedor + epgshare01 + Open-EPG + FAST)
        run: |
          curl -s -L -A "Mozilla/5.0" "http://megaottdns.shop" -o "epg_proveedor.xml" || true

          D="epgshare01.online"
          P="epgshare01"
          for F in MX1 PLEX1 DO1 PE1 CR1 EC1 PA1 SV1 UY1 US2 US_LOCALS1 US_SPORTS1 PEACOCK1 DISTROTV1 FANDUEL1 DRAFTKINGS1 AMCCHANNELS1 RAKUTEN1 WHALETVPLUS1 TBNPLUS1 DELUXEMUSIC1 MUSICBOX1 RALLY_TV1 CA2 UK1 ES1 AR1 CO1 CL1 DIRECTVSPORTS1 BEIN1 ZA1 MY1 AU1; do
            curl -s -L "https://${D}/${P}/epg_ripper_${F}.xml.gz" -o "epg_ripper_${F}.xml.gz" || true
          done

          M="i.mjh.nz"
          for F in PlutoTV/all Plex/all SamsungTVPlus/all Roku/all; do
            NOMBRE=$(echo "$F" | tr '/' '_')
            curl -s -L "https://${M}/${F}.xml.gz" -o "fast_${NOMBRE}.xml.gz" || true
          done

          O="open-epg.com"
          for F in mexico1 mexico2 usa1 usa2 canada1 spain1 uk1 argentina1 colombia1 chile1 peru1; do
            curl -s -L "https://${O}/files/${F}.xml.gz" -o "openepg_${F}.xml.gz" || true
          done

          G="://githubusercontent.com"
          for F in plex_us plex_mx plex_es pluto_us pluto_mx pluto_es samsung_us samsung_mx roku_us tubi_us; do
            curl -s -L "https://${G}/${F}.xml.gz" -o "fast2_${F}.xml.gz" || true
          done

          find . -maxdepth 1 -type f -size -10k \( -name 'epg_ripper_*' -o -name 'openepg_*' -o -name 'fast*' \) -delete
          gunzip -f epg_ripper_*.xml.gz openepg_*.xml.gz fast*.xml.gz 2>/dev/null || true

      - name: Unir, deduplicar y optimizar epg_maestra.xml
        run: |
          python3 -c '
          import re, os, glob, xml.etree.ElementTree as ET
          ids = set(re.findall(r"tvg-id=\"([^\"]+)\"", open("mis_ids.txt").read()))
          archivos = ["epg_mundial_3dias.xml", "epg_proveedor.xml"] + sorted(glob.glob("epg_ripper_*.xml")) + sorted(glob.glob("openepg_*.xml")) + sorted(glob.glob("fast*.xml"))
          canales_con_guia = set()
          vistos_prog = set()
          with open("epg_maestra.xml", "w", encoding="utf-8") as out:
              out.write("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<tv>\n")
              for r in archivos:
                  if not os.path.exists(r): continue
                  progs, chans = {}, {}
                  try:
                      for _, el in ET.iterparse(r, events=("end",)):
                          if el.tag == "channel":
                              c = el.get("id")
                              if c in ids and c not in canales_con_guia:
                                  chans[c] = ET.tostring(el, encoding="unicode").strip()
                              el.clear()
                          elif el.tag == "programme":
                              c = el.get("channel")
                              st = el.get("start", "")[:14]
                              if c in ids and c not in canales_con_guia and st and (c, st) not in vistos_prog:
                                  vistos_prog.add((c, st))
                                  progs.setdefault(c, []).append(ET.tostring(el, encoding="unicode").strip())
                              el.clear()
                      for c, lp in progs.items():
                          out.write("  " + chans.get(c, f"<channel id=\"{c}\"><display-name>{c}</display-name></channel>") + "\n")
                          for p in lp: out.write("  " + p + "\n")
                          canales_con_guia.add(c)
                  except: pass
              out.write("</tv>\n")
          txt = open("epg_maestra.xml", encoding="utf-8").read()
          txt = re.sub(r"<desc[^>]*>.*?</desc>", "", txt, flags=re.DOTALL)
          txt = re.sub(r"<image>.*?</image>", "", txt)
          txt = re.sub(r"<icon[^>]*/>", "", txt)
          open("epg_maestra.xml", "w", encoding="utf-8").write(txt)
          '

      - name: Guardar epg_maestra.xml actualizado
        run: |
          H="github.com"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.${H}"
          git add epg_maestra.xml
          git commit -m "Actualizacion diaria EPG Maestra" || exit 0
          git push
